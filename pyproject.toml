[project]
name = "dta"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "anthropic>=0.86.0",
    "numpy==1.26.4",
    "openai>=2.29.0",
    "pandas>=2.3.3",
    "peft>=0.18.1",
    "python-dotenv>=1.2.2",
    "tiktoken>=0.12.0",
    "together>=2.5.0",
    "torch>=2.7.0",
    "tqdm>=4.67.3",
    "transformers==4.43.1",
]

[[tool.uv.index]]
name = "pytorch-cu128"
url = "https://download.pytorch.org/whl/cu128"
explicit = true

[tool.uv.sources]
torch = [
  { index = "pytorch-cu128", marker = "sys_platform == 'linux' or sys_platform == 'win32'" },
]
