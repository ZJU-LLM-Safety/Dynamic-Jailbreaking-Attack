[pytest]
# Pytest配置文件 / Pytest Configuration File

# 测试文件匹配模式 / Test file patterns
python_files = test_*.py
python_classes = Test*
python_functions = test_*

# 测试目录 / Test directories
testpaths = tests

# 输出选项 / Output options
addopts =
    -v
    --strict-markers
    --tb=short
    --disable-warnings

# 标记定义 / Marker definitions
markers =
    slow: marks tests as slow (deselect with '-m "not slow"')
    integration: marks tests as integration tests
    unit: marks tests as unit tests
    requires_gpu: marks tests that require GPU
    requires_api: marks tests that require API access

# 最小Python版本 / Minimum Python version
minversion = 3.8

# 覆盖率配置 / Coverage configuration
[coverage:run]
source = adversarial_attack
omit =
    */tests/*
    */setup.py
    */__init__.py

[coverage:report]
exclude_lines =
    pragma: no cover
    def __repr__
    raise AssertionError
    raise NotImplementedError
    if __name__ == .__main__.:
    if TYPE_CHECKING:
    @abstractmethod
